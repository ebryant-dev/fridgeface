<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fridgeface: embedded</title>
    <link rel="icon" href="data:," />
    <style>
      body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #222; background: #fafafa; }
      main { max-width: 960px; margin: 0 auto; padding: 0 16px; }
      h1 { margin: 48px 0 8px; }
      .filler { height: 520px; }
      /* The element only needs a definite size: here a 900 x 600 box in the middle of a scrolling page. */
      .stage { width: 900px; max-width: 100%; height: 600px; margin: 24px auto; border: 1px solid #999; }
      .stage fridge-face { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <main>
      <h1>Fridgeface embedded</h1>
      <p>The toy sits in a normal page. Scrolling here moves the page; scrolling, dragging or pinching inside the box moves the board.</p>
      <div class="filler" id="above">Content above the element.</div>
      <div class="stage"><fridge-face share-base="https://example.com/play"></fridge-face></div>
      <div class="filler" id="below">Content below the element.</div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
